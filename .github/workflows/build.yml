name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # publicar a Release que o app usa para se atualizar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Número do build: o app compara com a última Release para saber se
      # há atualização. Vai em app.json → extra.buildNumber e no versionCode.
      - name: Gravar número do build
        run: |
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json"));
            const n = Number(process.env.GITHUB_RUN_NUMBER || 0);
            app.expo.extra = { ...(app.expo.extra || {}), buildNumber: n };
            app.expo.android.versionCode = n;
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
          '

      - name: Instalar dependências
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verificar tipos (TypeScript)
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --no-install --clean

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - uses: actions/upload-artifact@v4
        with:
          name: agenda-empresas-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # Publica o APK numa Release (build-<número>). O app procura a última
      # Release para avisar que há atualização e instalar com 1 toque.
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk EmpresasParks.apk
          TAG="build-${GITHUB_RUN_NUMBER}"
          VER=$(node -p 'require("./app.json").expo.version')
          gh release create "$TAG" EmpresasParks.apk \
            --repo "$GITHUB_REPOSITORY" --title "Empresas e Parks ${VER}" \
            --notes "Veja as novidades no README." --latest
